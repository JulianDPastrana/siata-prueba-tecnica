# Corre las pruebas automáticas en cada push. Usan series sintéticas; las del dashboard necesitan las salidas del pipeline y aquí se saltan.
name: pruebas
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: pytest -q
